<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
    <div id="display">0</div>
 
    <div class="operators">
      <button class="operator" data-operator="+">+</button>
      <button class="operator" data-operator="-">-</button>
      <button class="operator" data-operator="*">&times;</button>
      <button class="operator" data-operator="/">&divide;</button>
    </div>
 
    <div class="keys">
      <div class="numbers">
        <button class="digit">7</button>
        <button class="digit">8</button>
        <button class="digit">9</button>
        <button class="digit">4</button>
        <button class="digit">5</button>
        <button class="digit">6</button>
        <button class="digit">1</button>
        <button class="digit">2</button>
        <button class="digit">3</button>
        <button class="digit">0</button>
        <button id="decimal">.</button>
        <button id="clear">CE</button>
      </div>
 
      <button id="equals">=</button>
    </div>
  </div>



<script>

let firstNumber = "";
let secondNumber = "";
let operator = "";

function add(a, b) {return a + b; }
function subtract(a, b) { return a - b; }
function multiply(a, b) { return a * b; }
function divide(a, b) { return a / b; }

function operate (a,operator, b ) {
    firstNumber = Number(firstNumber)
    secondNumber = Number(secondNumber)

     if (operator === "+") return add(a, b);
     if (operator === "-") return subtract(a, b);
     if (operator === "*") return multiply(a, b);
     if (operator === "/") return divide(a, b);
}

const display = document.querySelector("#display");
const digits = document.querySelectorAll(".digit");
const operators = document.querySelectorAll(".operator");
const equal = document.querySelector("#equals")
const clear = document.querySelector("#clear")

// Digits: fill the first number, or the second once an operator is chosen
digits.forEach((digit) => {
  digit.addEventListener("click", () => {
    if (operator === "") {
      firstNumber += digit.textContent;
      display.textContent = firstNumber;
    } else {
      secondNumber += digit.textContent;
      display.textContent += secondNumber;
    }
  });
});

// Operators: remember which one was clicked
operators.forEach((btn) => {
  btn.addEventListener("click", () => {
    operator = btn.dataset.operator;
    display.textContent += operator;
  });
});


equal.addEventListener("click", () => {
  // If any piece is missing, do nothing
  if (firstNumber === "" || operator === "" || secondNumber === "") return;

  const result = operate(Number(firstNumber), operator, Number(secondNumber));
  display.textContent = result;

  // Get ready for the next calculation
  firstNumber = String(result);
  secondNumber = "";
  operator = "";
});

clear.addEventListener("click", () => {
    firstNumber = "";
    secondNumber = "";
    operator = "";
    display.textContent = "0";
});


</script>
</body>
</html>
